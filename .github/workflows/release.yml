name: Release

# Builds the VerbaScribe.exe launcher from build_exe.py on a clean Windows runner and publishes
# it together with a source archive and SHA-256 checksums, so every binary can be traced to a commit.
on:
  push:
    tags:
      - "v*"
  # Run by hand: without a tag only builds (artifacts to try out); with a tag, e.g. v0.2.0-beta.1,
  # also creates that tag on the commit it ran for and publishes the release
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create and publish (empty: build only)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/') || inputs.tag != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.10"

      # The app compares its own version with the latest release tag (app/updater.py)
      - name: Check that the tag matches app/__init__.py
        if: env.PUBLISH == 'true'
        shell: pwsh
        run: |
          $v = python -c "import re; print(re.search(r'__version__ = \x22(.+?)\x22', open('app/__init__.py').read()).group(1))"
          if ("v$v" -ne "$env:TAG") { throw "Tag $env:TAG does not match __version__ $v" }

      # Without the app's packages most tests skip themselves; with them every test runs
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run unit tests
        shell: pwsh
        run: |
          $out = python -m unittest discover -v -s tests -t . 2>&1 | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 0) { throw "Unit tests failed" }
          # A test may skip itself for a missing tool (FFmpeg), never for a missing Python package
          if ($out -match "skipped '[^']*not installed") { throw "Tests were skipped: a package is missing from requirements-test.txt" }

      - name: Build launcher (csc.exe from .NET Framework)
        run: python build_exe.py

      - name: Package release
        shell: pwsh
        run: |
          $name = "VerbaScribe-$($env:TAG -replace '[\\/]', '-')"
          git archive --format=zip --prefix="$name/" -o source.zip HEAD
          Expand-Archive source.zip -DestinationPath dist
          Copy-Item VerbaScribe.exe "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "$name.zip"
          Get-FileHash VerbaScribe.exe, "$name.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Encoding utf8 SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      # SHA256SUMS.txt signed with the author's release key (docs/release-signing.md). Once its public
      # key is in app/updater.py, installed apps take only signed releases: then a missing secret stops
      # the release instead of publishing one nobody could install.
      - name: Sign checksums
        shell: pwsh
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          $hasKey = Select-String -Path app/updater.py -Pattern '^RELEASE_PUBLIC_KEY = ".+"' -Quiet
          if ($env:RELEASE_SIGNING_KEY) {
            python tools/release_key.py sign SHA256SUMS.txt --tag $env:TAG
            if ($LASTEXITCODE -ne 0) { throw "Signing failed" }
            if ($hasKey) {
              python tools/release_key.py verify SHA256SUMS.txt --tag $env:TAG
              if ($LASTEXITCODE -ne 0) { throw "The signature does not check out with the key in app/updater.py" }
            }
          } elseif ($hasKey -and $env:PUBLISH -eq 'true') {
            throw "app/updater.py has a release key but the RELEASE_SIGNING_KEY secret is missing: installed apps would refuse this release"
          } else {
            Write-Output "No release key yet: SHA256SUMS.txt is not signed"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: verbascribe-release
          path: |
            VerbaScribe-*.zip
            VerbaScribe.exe
            SHA256SUMS.txt
            SHA256SUMS.txt.minisig

      # With the gh tool of the runner: no third-party action gets the token that writes releases.
      # v1.2.0-beta.1 and the like are pre-releases: releases/latest (the in-app update check) skips
      # them, so only people who download them by hand get them
      - name: Publish GitHub release
        if: env.PUBLISH == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem VerbaScribe-*.zip | ForEach-Object Name) + @('VerbaScribe.exe', 'SHA256SUMS.txt')
          if (Test-Path SHA256SUMS.txt.minisig) { $files += 'SHA256SUMS.txt.minisig' }
          # @(...) keeps these arrays: an if returning one item gives a plain string, and splatting a
          # string passes its characters one by one (a beta's --prerelease became "-", "-", "p", …)
          $pre = @(if ($env:TAG.Contains('-')) { '--prerelease' })
          # The page's text: the version's section of CHANGELOG.md, or GitHub's list of commits
          python tools/release_notes.py $env:TAG notes.md
          $notes = @(if ((Get-Item notes.md).Length -gt 0) { '--notes-file', 'notes.md' } else { '--generate-notes' })
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload $env:TAG @files --clobber }
          else { gh release create $env:TAG @files --target $env:GITHUB_SHA --title $env:TAG @notes @pre }
          if ($LASTEXITCODE -ne 0) { throw "Publishing the release failed" }
