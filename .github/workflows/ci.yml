name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # Windows is what users run; Ubuntu also runs the browser smoke test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.10"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        if: runner.os == 'Linux'
        with:
          node-version: "20"

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt uvicorn

      # Every module compiles, including the ones no test imports (Windows-only code paths)
      - name: Compile check
        run: python -m compileall -q app run.py build_exe.py tests

      - name: Unit tests
        run: python -m unittest discover -s tests -t .

      - name: Build launcher (csc.exe from .NET Framework)
        if: runner.os == 'Windows'
        run: python build_exe.py

      - name: Install browser
        if: runner.os == 'Linux'
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: UI smoke test
        if: runner.os == 'Linux'
        env:
          VERBASCRIBE_TOKEN: smoke
          VERBASCRIBE_SKIP_MIGRATION: "1"
          PYTHONPATH: tests/stubs
        run: |
          export VERBASCRIBE_DATA_DIR="$RUNNER_TEMP/data" VERBASCRIBE_MODELS_DIR="$RUNNER_TEMP/models"
          python -m uvicorn app.main:app --port 8799 > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8799/ && break; sleep 1; done
          node tests/ui/smoke.mjs || (cat "$RUNNER_TEMP/server.log"; exit 1)

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.10"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"

      - name: Install tools
        run: python -m pip install uv==0.12.24 pip-audit==2.10.1

      # requirements.txt is installed on Windows with --require-hashes: every package (transitive
      # ones too) must be in it with a hash and resolve for Windows, or setup.bat and updates fail
      - name: requirements.txt resolves for Windows with hashes
        run: |
          uv pip install --dry-run --require-hashes -r requirements.txt \
            --python-platform x86_64-pc-windows-msvc --python-version 3.10 --target "$RUNNER_TEMP/resolve" \
            --index-strategy unsafe-best-match --extra-index-url https://download.pytorch.org/whl/cu124

      # Known vulnerabilities of the pinned versions. torch/torchaudio (+cu124 builds) are not on PyPI
      # and are skipped.
      - name: pip-audit
        run: pip-audit -r requirements.txt --disable-pip --no-deps --progress-spinner off

      # The dubbing environment's lock. Its findings cannot be fixed there for now: chatterbox-tts 0.1.7
      # pins transformers 5.2.0 and diffusers 0.29.0, perth needs setuptools<81, and Pillow 13 needs
      # Python 3.11 (the environment is 3.10). So they are listed as a warning instead of failing.
      - name: pip-audit (dubbing environment)
        run: |
          pip-audit -r requirements-dub.txt -r requirements-dub-chatterbox.txt --disable-pip --no-deps --progress-spinner off \
            || echo "::warning title=Dubbing environment::known vulnerabilities in requirements-dub.txt (see this step's log)"

      # The npm packages are build tools plus the libraries copied into static/vendor. Only those
      # libraries reach the page: a finding in them fails, a build-only finding (Tailwind's file
      # watching and globbing on our own files) is listed as a notice.
      - name: npm audit (libraries shipped to the page)
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e '
            const shipped = new Set(["dompurify", "marked", "@fontsource-variable/inter", "@fontsource-variable/jetbrains-mono"]);
            const report = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const vulns = Object.values(report.vulnerabilities || {});
            let failed = false;
            for (const v of vulns) {
              const line = `${v.name} (${v.severity}): ${v.via.map(x => typeof x === "string" ? x : x.title).join("; ")}`;
              if (shipped.has(v.name)) { console.log(`::error::${line}`); failed = true; }
              else console.log(`::notice::build only: ${line}`);
            }
            process.exit(failed ? 1 : 0);
          ' "$RUNNER_TEMP/npm-audit.json"
