name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-test.txt uvicorn
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Unit tests
        run: python -m unittest discover -s tests -t .

      - name: UI smoke test
        env:
          VERBASCRIBE_TOKEN: smoke
          VERBASCRIBE_SKIP_MIGRATION: "1"
          PYTHONPATH: tests/stubs
        run: |
          export VERBASCRIBE_DATA_DIR="$RUNNER_TEMP/data" VERBASCRIBE_MODELS_DIR="$RUNNER_TEMP/models"
          python -m uvicorn app.main:app --port 8799 > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8799/ && break; sleep 1; done
          node tests/ui/smoke.mjs || (cat "$RUNNER_TEMP/server.log"; exit 1)
