<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VerbaScribe</title>
  <link rel="stylesheet" href="/static/vendor/tailwind.css">
  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/vendor/purify.min.js"></script>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="h-screen overflow-hidden flex select-none"
      ondragover="onWindowDragOver(event)"
      ondrop="handleGlobalDrop(event)">

  <!-- Shown while files are dragged over the window (see onWindowDragEnter) -->
  <div id="drop-overlay" class="drop-overlay hidden" aria-hidden="true">
    <div class="drop-overlay-card">
      <div class="drop-overlay-icon">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/></svg>
      </div>
      <div id="drop-overlay-title" class="text-[17px] font-semibold text-white" data-i18n="dropOverlayTitle">Отпустите, чтобы добавить файлы</div>
      <div id="drop-overlay-sub" class="text-xs text-apple-secondary mt-1.5" data-i18n="dropOverlaySub">Каждый файл станет отдельной записью в медиатеке</div>
    </div>
  </div>


  <!-- @include parts/sidebar.html -->

  <!-- @include parts/workspace.html -->

  <!-- @include parts/menus.html -->

  <!-- @include parts/modals.html -->

  <!-- @include parts/settings.html -->

  <!-- @include parts/about.html -->

  <!-- Minimal Apple Pill Toast -->
  <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 hidden max-w-[80vw] break-words bg-apple-elevated/95 apple-blur border apple-border text-white px-4 py-1.5 rounded-xl shadow-xl text-xs font-medium z-50"></div>

  <script src="/static/i18n.js"></script>
  <!-- The page script in parts (static/js), in this order: they share one global scope -->
  <script src="/static/js/core.js"></script>
  <script src="/static/js/menus.js"></script>
  <script src="/static/js/settings.js"></script>
  <script src="/static/js/library.js"></script>
  <script src="/static/js/workspace.js"></script>
  <script src="/static/js/player.js"></script>
  <script src="/static/js/studio.js"></script>
  <script src="/static/js/video.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
