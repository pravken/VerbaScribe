    <div id="home-view" class="hidden flex-1 min-h-0 overflow-y-auto bg-apple-bg">
      <div class="home-wrap">
        <div class="flex items-end justify-between gap-4 flex-wrap">

            <div id="home-date" class="text-[12px] font-semibold uppercase tracking-wider text-apple-tertiary"></div>

        </div>

          <h2 class="home-card-title" data-i18n="homeRecent">Недавние записи</h2>
