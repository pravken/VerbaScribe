<!-- The status bar under the whole window (renderStatusbar in static/js/shell.js): part of static/index.html.
     It shows the queue; the processor, memory, video card and the models in memory are in the sidebar,
     under the logo. Above it: the question before an in-person meeting and the dictation of the home
     page (static/js/home.js). -->
  <footer id="app-statusbar" class="statusbar" role="status">
    <span class="flex-1"></span>
    <button data-click="openStatusbarQueue" id="sb-queue" class="sb-queue"></button>
  </footer>

  <!-- Before an in-person meeting with the automatic recording on: record it from the microphone? -->
  <div id="hm-ask" class="hm-ask hidden" role="alertdialog" aria-labelledby="hm-ask-title">
    <div class="flex items-start gap-3">
      <span class="hm-ask-icon" aria-hidden="true"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span>
      <span class="flex-1 flex flex-col gap-1 min-w-0">
        <b id="hm-ask-title" class="text-[13.5px] font-semibold text-white"></b>
        <span id="hm-ask-text" class="text-[12.5px] leading-snug text-apple-label"></span>
      </span>
      <button data-click="hmAskAnswer" data-click-args='[null]' class="hm-x" data-i18n-title="tipCloseModal" title="Закрыть окно">✕</button>
    </div>
    <div class="flex gap-2">
      <button data-click="hmAskAnswer" data-click-args='[true]' class="hm-ask-yes" data-i18n="hmAskRecord">● Записать</button>
      <button data-click="hmAskAnswer" data-click-args='[false]' class="hm-ask-no" data-i18n="hmAskNotNow">Не сейчас</button>
    </div>
    <span class="text-[11.5px] text-apple-tertiary" data-i18n="hmAskWarn">Предупредите участников, что идёт запись.</span>
  </div>

  <!-- Dictation from the home page: while it listens, then the text it heard -->
  <div id="hm-dict" class="hm-dict hidden" role="status">
    <span id="hm-dict-lvl" class="hm-lvl" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
    <span class="flex flex-col gap-0.5 min-w-0">
      <b id="hm-dict-title" class="text-[13.5px] font-semibold text-white"></b>
      <span id="hm-dict-text" class="hm-dict-text"></span>
    </span>
    <button id="hm-dict-done" data-click="hmDictToggle" class="hm-ask-yes hm-dict-btn" data-i18n="hmDictDone">Готово</button>
    <button id="hm-dict-copy" data-click="hmDictCopy" class="hm-ask-yes hm-dict-btn hidden" data-i18n="hmDictCopy">Копировать</button>
    <button id="hm-dict-cancel" data-click="hmDictCancel" class="hm-ask-no hm-dict-btn" data-i18n="cancel">Отмена</button>
  </div>
